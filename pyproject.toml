[project]
name = "sombra"
version = "0.1.0"
description = "Brazilian PII recognizers for Presidio — CPF, CEP, CNPJ and street addresses"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Sombra contributors" }]
keywords = ["pii", "privacy", "presidio", "brazil", "cpf", "cep", "cnpj", "anonymization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "presidio-analyzer>=2.2.354",
    "spacy>=3.7",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
# Used when running inside the Presidio analyzer container image, which
# already ships `presidio-analyzer` and spaCy.
server = []

[dependency-groups]
dev = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sombra"]

[tool.pytest.ini_options]
testpaths = ["src/sombra/tests"]
addopts = "-q"