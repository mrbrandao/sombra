site_name: Sombra
site_description: Local PII anonymization proxy for agent and LLM CLIs
site_url: ""
repo_url: ""
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - tables
  - codehilite

nav:
  - Home: index.md