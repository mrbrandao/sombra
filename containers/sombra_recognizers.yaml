  # --- Sombra: Brazilian PII recognizers ------------------------------------
  # These extend Presidio's default set with patterns for Brazilian data.
  # Everything above keeps working; Sombra only adds what is missing.
  # See https://presidio.dataprivacystack.org/analyzer/developing_recognizers/

  - name: "Sombra CPF recognizer"
    supported_language: "pt"
    patterns:
      - name: "CPF formatted"
        regex: "\\b\\d{3}\\.\\d{3}\\.\\d{3}-\\d{2}\\b"
        score: 0.95
      - name: "CPF unformatted"
        regex: "\\b\\d{11}\\b"
        score: 0.5
    context:
      - cpf
      - documento
      - inscrição
      - inscricao
      - cadastro de pessoa física
      - registro
    supported_entity: "SOMBRA_CPF"

  - name: "Sombra CEP recognizer"
    supported_language: "pt"
    patterns:
      - name: "CEP formatted"
        regex: "\\b\\d{5}-\\d{3}\\b"
        score: 0.95
      - name: "CEP unformatted"
        regex: "\\b\\d{8}\\b"
        score: 0.5
    context:
      - cep
      - código postal
      - codigo postal
      - endereço
      - endereco
    supported_entity: "SOMBRA_CEP"

  - name: "Sombra CNPJ recognizer"
    supported_language: "pt"
    patterns:
      - name: "CNPJ formatted"
        regex: "\\b\\d{2}\\.\\d{3}\\.\\d{3}/\\d{4}-\\d{2}\\b"
        score: 0.95
      - name: "CNPJ unformatted"
        regex: "\\b\\d{14}\\b"
        score: 0.5
    context:
      - cnpj
      - empresa
      - inscrição estadual
      - inscricao estadual
      - cadastro nacional da pessoa jurídica
    supported_entity: "SOMBRA_CNPJ"

  - name: "Sombra address recognizer"
    supported_language: "pt"
    patterns:
      - name: "Address with street type and number"
        regex: "\\b(?:avenida|av\\.|rua|alameda|travessa|estrada|rodovia|praça|praca|beco|viela|ladeira|vila|passagem|acesso|servidão|servidao)\\s+[A-Za-zÀ-ÿ0-9''.,/ºª\\- ]+?\\s*(?:n[º°]?\\.?|número|numero|num\\.?|n\\.?)?\\s*\\d{1,5}\\b"
        score: 0.75
      - name: "Property unit with number"
        regex: "\\b(?:casa|sobrado|apartamento|apto\\.?|lote|quadra|bloco|complemento|fundos|andar|galpão|galpao|kitnet|cobertura|salão|salao)\\s*(?:n[º°]?\\.?|n\\.?)?\\s*\\d{1,5}\\b"
        score: 0.6
      - name: "Street type with name"
        regex: "\\b(?:avenida|av\\.|rua|alameda|travessa|estrada|rodovia|praça|praca|beco|viela|ladeira|vila|passagem|acesso|servidão|servidao)\\s+[A-Za-zÀ-ÿ0-9''.,/ºª\\- ]{2,60}\\b"
        score: 0.4
    context:
      - endereço
      - endereco
      - rua
      - avenida
      - alameda
      - travessa
      - bairro
      - cidade
      - cep
      - casa
      - lote
      - quadra
      - apartamento
      - condomínio
      - condominio
      - residência
      - residencia
      - complemento
      - número
      - numero
      - address
    supported_entity: "SOMBRA_ADDRESS"
